[project]
name = "pinger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "michaelwsd", email = "michaelwsd@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
pinger = "pinger:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
